<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — Reflective</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family: Georgia, serif; background:#faefdb; color:#3b2320; text-align:center; }
  @media (prefers-color-scheme: dark) { body { background:#231915; color:#f3e3c8; } }
  p { font-family: system-ui, sans-serif; opacity:.8; max-width:28rem; line-height:1.5; }
  button { font:inherit; font-family: system-ui, sans-serif; padding:12px 20px; border-radius:999px; border:0;
    background:#7a3b2e; color:#fff; min-height:44px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" width="72" height="72" alt="" style="border-radius:16px" />
  <h1>You're offline</h1>
  <p>Reflective needs a connection to open your journal. Anything you were typing in a reflection is kept on this device.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
